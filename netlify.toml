# Netlify configuration for Tidal Swimwear
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---- Clean URL rewrites (pretty URL shown, .html file served) ----
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/lookbook"
  to = "/look book.html"
  status = 200

[[redirects]]
  from = "/our-story"
  to = "/Our-story.html"
  status = 200

[[redirects]]
  from = "/press"
  to = "/Press & Pop-ups.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/size-guide"
  to = "/Tidal-size-guide.html"
  status = 200

[[redirects]]
  from = "/shipping-returns"
  to = "/Tidal-shipping-returns.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

# ---- Old messy URLs redirect to clean ones (301 = permanent) ----
[[redirects]]
  from = "/look book.html"
  to = "/lookbook"
  status = 301

[[redirects]]
  from = "/Our-story.html"
  to = "/our-story"
  status = 301

[[redirects]]
  from = "/Press & Pop-ups.html"
  to = "/press"
  status = 301

[[redirects]]
  from = "/Tidal-size-guide.html"
  to = "/size-guide"
  status = 301

[[redirects]]
  from = "/Tidal-shipping-returns.html"
  to = "/shipping-returns"
  status = 301

# ---- Convenience shortcut ----
[[redirects]]
  from = "/shop"
  to = "/collection.html"
  status = 301
